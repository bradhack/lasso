name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI only checks out and tests the code.
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Engine tests
        run: |
          pip install -e "engine[dev]"
          cd engine && pytest -q
      - name: Agents tests
        run: |
          pip install -r services/agents/requirements.txt pytest
          cd services/agents && python -m pytest -q
      - name: API tests (every slip the evaluations found, replayed against the showcase match)
        run: |
          pip install -r services/api/requirements.txt pytest
          cd services/api && LASSO_DATA_DIR=../../data/demo python -m pytest -q tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: az bicep build --file infra/main.bicep --stdout > /dev/null
