# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: lasso
metadata:
  template: lasso@1.0.0
infra:
  provider: bicep
  path: infra
services:
  api:
    project: ./services/api
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
  feed:
    project: ./services/api
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile.feed
      context: ../..
      remoteBuild: true
  agents:
    project: ./services/agents
    host: containerapp
    language: python
    docker:
      path: ./Dockerfile
      remoteBuild: true
